[project]
name = "familiar"
version = "0.1.0"
description = "A modular voice companion with personality for sim games and the desk."
readme = "AGENTS.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=3.3.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
familiar = "familiar.cli:main"

[project.entry-points."familiar.llm"]
gemini = "familiar.backends.gemini.llm:GeminiLLM"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/familiar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RET"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits real APIs (needs keys); run with -m live"]
addopts = "-m 'not live'"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]
