[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RET"]

[tool.pytest.ini_options]
testpaths = ["packages/familiar/tests", "packages/familiar-scs/tests", "packages/familiar-ksp/tests", "packages/familiar-elite/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits real APIs (needs keys); run with -m live"]
addopts = "-m 'not live'"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

