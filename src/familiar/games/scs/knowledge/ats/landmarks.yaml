    spanning 275 feet.
  - Snake Alley was built in 1894 to link the downtown business district and the neighborhood shopping
    area, and writer Robert L. Ripley later called it 'The Crookedest Street in the World' in his column.
  - The alley is composed of limestone and blueclay bricks laid at an angle to allow horses better footing
