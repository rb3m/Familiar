  state: SD
  lat: 43.8354
  lon: -103.6213
  radius_km: 25
  kind: engineering
  highway: US-16
  facts:
  - It is a monumental mountain sculpture being carved out of Thunderhead Mountain honoring the Oglala
    Lakota warrior Crazy Horse.
  - Begun in 1948 by sculptor Korczak Ziolkowski at the invitation of Lakota Chief Henry Standing Bear,
    work continues under a private foundation.
