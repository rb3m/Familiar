# ATS landmark pack: real-world landmarks near ATS highways (21 states as of 2026-11-15).
# Researched by agy (web search); coordinates verified against Wikipedia (scripts/verify_landmarks.py,
# all within 5 km); every fact judged against its article text (scripts/factcheck_landmarks.py) and
# corrected or dropped (scripts/apply_factcheck.py). Run both checks again after editing.

- id: cabazon-dinosaurs
