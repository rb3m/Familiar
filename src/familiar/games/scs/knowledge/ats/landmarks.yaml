  lon: -91.4114
  radius_km: 25
  kind: historic
  highway: I-20
  facts:
  - It is a massive prehistoric earthwork complex built between 1700 and 1100 BC by indigenous hunter-gatherers
    in northeastern Louisiana.
  - The site features six concentric curved earthen ridges flanking a plaza and multiple massive earthen
    mounds, including Mound A.
  - Poverty Point was inscribed as a UNESCO World Heritage Site on June 22, 2014.
  source: https://en.wikipedia.org/wiki/Poverty_Point
- id: uss-kidd
