  state: LA
  lat: 30.4443
  lon: -91.1915
  radius_km: 15
  kind: historic
  highway: I-10
  facts:
  - It is a decorated Fletcher-class destroyer that served in the United States Navy during World War
    II and the Korean War.
  - Moored on the Mississippi River in downtown Baton Rouge, it is preserved in its authentic 1945 wartime
    configuration.
  - Kidd's special mooring in the Mississippi River is designed to cope with the annual change in river
    depth, where half the year she floats as the river rises, and the other half she sits on keel blocks.
