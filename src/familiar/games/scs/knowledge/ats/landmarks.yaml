  - Designed by architect Albert L. Farr and completed in 1934, it was commissioned by industrialist Robert
    Ilg to house a large water tank and pumping equipment for pools and an artificial lake in a recreation
    park for employees.
  source: https://en.wikipedia.org/wiki/Leaning_Tower_of_Niles
