    been used by trains or motor vehicles.
  - It rises to 90 feet over the Arkansas River, and its LED lighting design received an Award of Merit
    from the Illuminating Engineer Society.
  source: https://en.wikipedia.org/wiki/Big_Dam_Bridge
- id: thorncrown-chapel
