  - Attractions in the town include the World's Largest Wind Chime, World's Largest Rocking Chair, World's
    Largest Golf Tee, and World's Largest Mailbox.
  - Jim Bolin constructed these items to bring in more tourism and revitalize Casey during a time of economic
    distress.
