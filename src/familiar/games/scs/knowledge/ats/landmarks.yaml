    the Missouri River near Chamberlain.
  - Created by South Dakota artist laureate Dale Claude Lamphere, it honors the Lakota and Dakota nations.
  - The star quilt held by the woman has more than 100 blue diamond shapes that move in the wind.
  source: https://en.wikipedia.org/wiki/Dignity_of_Earth_and_Sky
- id: badlands-national-park
  name: Badlands National Park
  state: SD
  lat: 43.75
  lon: -102.5
  radius_km: 50
  kind: natural
  highway: I-90
  facts:
  - The park protects 242,756 acres of sharply eroded buttes, pinnacles, and the largest undisturbed mixed-grass
    prairie in the United States.
  - Its sedimentary rock layers contain one of the richest mammal fossil beds in the world, dating to
    the Oligocene epoch.
  - The Lakota people named the area mako sica due to its rugged terrain, extreme temperatures, and lack
    of water.
  source: https://en.wikipedia.org/wiki/Badlands_National_Park
