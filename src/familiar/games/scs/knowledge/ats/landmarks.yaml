    cities in Mexico and Central America.
  - The site contains Monks Mound, the largest prehistoric earthen construction in the Americas, covering
    14 acres and rising 100 feet tall.
  - The site was designated a UNESCO World Heritage Site in 1982 and lies in south-western Illinois between
    East St. Louis and Collinsville.
