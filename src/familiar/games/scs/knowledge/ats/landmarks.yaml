  - The gardens were created by Edward Avery McIlhenny, second son of Edmund McIlhenny, the inventor of
    Tabasco sauce, and feature a bird sanctuary called Bird City.
  - The gardens feature an ancient centuries-old Buddha statue gifted to McIlhenny in 1936.
  source: https://en.wikipedia.org/wiki/Jungle_Gardens
