  - It is located in Dyersville, Iowa, within Dubuque County, built on a farm whose owners' grandparents
    purchased it in 1906.
  - Major League Baseball planned for a regular-season game to be held at a temporary facility constructed
    in the cornfields.
  source: https://en.wikipedia.org/wiki/Field_of_Dreams_(Dubuque_County,_Iowa)
