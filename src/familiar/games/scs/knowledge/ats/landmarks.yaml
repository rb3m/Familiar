    stand and claimed to be the largest catsup bottle in the world.
  - Constructed in 1949 for the G.S. Suppiger Company catsup plant, the tank itself is 70 feet tall and
    holds 100,000 gallons.
  - It is trademarked "The World's Largest Catsup Bottle", is claimed to be the largest catsup bottle
    in the world, and is listed on the National Register of Historic Places.
  source: https://en.wikipedia.org/wiki/Brooks_Catsup_Bottle_water_tower
