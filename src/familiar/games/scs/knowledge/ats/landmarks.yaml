    a completely ride-through tour in a Jeep-drawn tram.
  - The cavern was discovered by John Knox and his hunting dog in 1862, and Knox kept the cave's existence
    quiet until 1867 to avoid exploitation by the Union or Confederate governments.
  - The caverns were used as a speakeasy during Prohibition.
  source: https://en.wikipedia.org/wiki/Fantastic_Caverns
