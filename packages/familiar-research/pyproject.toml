[project]
name = "familiar-research"
version = "0.1.0"
description = "Background read-only lookups through agy for Familiar."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["familiar>=0.1.0,<1.0.0", "pyyaml>=6.0.2"]

[tool.uv.sources]
familiar = { workspace = true }

[project.entry-points."familiar.services"]
research = "familiar_research.service:ResearchService"

[project.entry-points."familiar.commands"]
research = "familiar_research.commands:ResearchCommand"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/familiar_research"]

[project.entry-points."familiar_desk.sources"]
topics = "familiar_research.topic_source:TopicSource"
