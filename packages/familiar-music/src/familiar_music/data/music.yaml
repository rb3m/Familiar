# DJ tuning; override ~/.config/familiar/data/familiar_music/music.yaml; restart to reload.
duck_level: 0.25
# A volume read this close to one we set is treated as ours (reads lag writes and round).
volume_tolerance: 5
queue_top_up: 5
# A remark on the new song every [low, high] song changes (picked songs don't count).
remark_every: [3, 4]
# The carrier may choose new music every [low, high] song changes...
dj_turn_every: [8, 12]
# ...but not within this long of a music request, and never while music is paused.
autonomy_hold_s: 900
autonomous_picks: true
reseed_cooldown_s: 15
search_timeout_s: 10
search_limit: 8
calmer_query: calm relaxing music
# Genre requests: songs queued at once from a shuffled curated playlist, and how many to fetch.
genre_batch: 10
playlist_tracks: 100
# Volume (0-100, Pear's slider) when music starts, unless one was asked for; calmer music always.
play_volume: 70
calm_volume: 40

# Unrequested batches draw library, carrier taste, or YouTube discovery.
blend: {library: 70, persona: 20, discovery: 10}
local_min_matches: 8
library_enrich: true

# Behaviour: early player-UI changes are skips; a mostly heard song counts as played.
skip_early_s: 30
played_fraction: 0.8
# Decayed track and artist signals; artist influence uses the square root of its factor.
taste_half_life_days: 60
played_gain: 0.15
skip_penalty: 0.35
taste_min: 0.2
taste_max: 3.0
# Artist spacing and share of each local batch (rounded up to a whole song).
artist_cooldown_songs: 8
artist_cooldown_weight: 0.3
artist_batch_share: 0.3
# Occasional styles stay discoverable, with at most one per local batch.
occasional_genres: [cumbia, salsa, merengue, banda, reggaeton]
occasional_weight: 0.25
# Automatic local picks exclude short intros; explicit songs/artists may play them.
min_track_s: 90
