# Pear API defaults; override ~/.config/familiar/data/familiar_music/pear.yaml.
base_url: http://127.0.0.1:26538
client_id: familiar
call_timeout_s: 5
auth_timeout_s: 60
poll_interval_s: 5
recovery_interval_s: 30
token_path: familiar/music/pear-token
endpoints:
  auth: /auth/{id}
  song: /api/v1/song-info
  volume: /api/v1/volume
  play: /api/v1/play
  pause: /api/v1/pause
  next: /api/v1/next
  queue: /api/v1/queue
  like: /api/v1/like
  dislike: /api/v1/dislike
insert_now: INSERT_AFTER_CURRENT_VIDEO
insert_end: INSERT_AT_END
# Pear reads volume on a different curve than it writes: [written, read back] pairs, measured
# against Pear 3.12.1. get_volume inverts it so reads match writes. Re-measure after Pear updates
# by writing 0, 10, ... 100 and reading each back.
volume_curve:
  - [0, 0]
  - [10, 2]
  - [20, 5]
  - [30, 8]
  - [40, 13]
  - [50, 20]
  - [60, 29]
  - [70, 40]
  - [80, 55]
  - [90, 74]
  - [100, 100]
