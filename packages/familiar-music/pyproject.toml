[project]
name = "familiar-music"
version = "0.1.0"
description = "The companion as DJ: music services for Familiar (YouTube Music via Pear Desktop first)."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "familiar>=0.1.0,<1.0.0",
    "pyyaml>=6.0.2",
    "httpx>=0.28.1",
    "ytmusicapi>=1.12.4",
    "mutagen>=1.47.0",
]

[tool.uv.sources]
familiar = { workspace = true }

[project.entry-points."familiar.services"]
pear = "familiar_music.service:MusicService"
blend = "familiar_music.service:BlendMusicService"

[project.entry-points."familiar.commands"]
music = "familiar_music.commands:MusicCommand"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/familiar_music"]
