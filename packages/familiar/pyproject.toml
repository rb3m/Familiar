[project]
name = "familiar"
version = "0.1.0"
description = "A modular voice companion with personality for sim games and the desk."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "aiohttp>=3.14.5",
    "evdev>=2.0.0 ; sys_platform == 'linux'",
    "google-genai>=3.3.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pyobjc-framework-ApplicationServices>=11.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=11.0 ; sys_platform == 'darwin'",
    "pyyaml>=6.0.3",
    "sounddevice>=0.5.6",
]

[project.scripts]
familiar = "familiar.cli:main"

[project.entry-points."familiar.llm"]
gemini = "familiar.backends.gemini.llm:GeminiLLM"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/familiar"]

[project.entry-points."familiar.stt"]
gemini = "familiar.backends.gemini.stt:GeminiSTT"
elevenlabs = "familiar.backends.elevenlabs.stt:ElevenLabsSTT"

[project.entry-points."familiar.tts"]
gemini = "familiar.backends.gemini.tts:GeminiTTS"
elevenlabs = "familiar.backends.elevenlabs.tts:ElevenLabsTTS"

[project.entry-points."familiar.ptt"]
terminal = "familiar.ptt.terminal:TerminalPTT"
evdev = "familiar.ptt.evdev:EvdevPTT"


[project.entry-points."familiar.keyboard"]
uinput = "familiar.keyboard.uinput:UinputKeyboard"
