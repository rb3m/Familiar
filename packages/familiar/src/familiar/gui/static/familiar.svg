<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a7a"/>
      <stop offset="1" stop-color="#1a1240"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- background -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#fff6d5">
    <circle cx="52" cy="58" r="3"/>
    <circle cx="82" cy="38" r="2"/>
    <circle cx="196" cy="186" r="2.5"/>
    <path d="M200 46 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
  </g>
  <!-- crescent moon behind the cat -->
  <circle cx="112" cy="122" r="74" fill="url(#glow)" opacity="0.35"/>
  <path d="M150 64 a64 64 0 1 0 0 118 a52 52 0 1 1 0 -118z" fill="#ffd96a" opacity="0.95"/>
  <!-- cat familiar: head, ears, body -->
  <g fill="#120c26">
    <path d="M70 214 C70 168 86 148 112 148 C138 148 154 168 154 214 Z"/>
    <path d="M78 150 L82 98 L104 124 Z"/>
    <path d="M146 150 L142 98 L120 124 Z"/>
    <ellipse cx="112" cy="140" rx="38" ry="32"/>
    <path d="M150 206 C176 206 182 186 172 174" stroke="#120c26" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <!-- glowing eyes -->
  <g fill="#8ef0c8">
    <ellipse cx="98" cy="138" rx="7" ry="9"/>
    <ellipse cx="126" cy="138" rx="7" ry="9"/>
  </g>
  <g fill="#120c26">
    <ellipse cx="98" cy="139" rx="2.2" ry="6"/>
    <ellipse cx="126" cy="139" rx="2.2" ry="6"/>
  </g>
  <!-- voice waves -->
  <g fill="none" stroke="#8ef0c8" stroke-linecap="round">
    <path d="M168 122 a18 18 0 0 1 0 30" stroke-width="7"/>
    <path d="M184 110 a34 34 0 0 1 0 54" stroke-width="7" opacity="0.75"/>
    <path d="M200 98 a50 50 0 0 1 0 78" stroke-width="7" opacity="0.5"/>
  </g>
</svg>
