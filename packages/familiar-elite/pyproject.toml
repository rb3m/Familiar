[project]
name = "familiar-elite"
version = "0.1.0"
description = "Elite Dangerous telemetry, hands and exploration queries for Familiar."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["familiar>=0.1.0,<1.0.0", "pyyaml>=6.0.2", "httpx>=0.28.1"]

[tool.uv.sources]
familiar = { workspace = true }

[project.entry-points."familiar.games"]
elite = "familiar_elite.adapter:EliteAdapter"

[project.entry-points."familiar.commands"]
elite-bindings = "familiar_elite.bind_command:EliteBindings"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/familiar_elite"]
