[project]
name = "familiar-elite"
version = "0.1.0"
description = "Read-only local Elite Dangerous game pack for Familiar."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["familiar>=0.1.0,<1.0.0", "pyyaml>=6.0.2"]

[tool.uv.sources]
familiar = { workspace = true }

[project.entry-points."familiar.games"]
elite = "familiar_elite.adapter:EliteAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/familiar_elite"]
