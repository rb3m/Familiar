# Elite controls Familiar drives from the keyboard, in the order keys are assigned.
# Secondary slots that still read {NoDevice} get the first free candidate key.
# Override: ~/.config/familiar/data/familiar_elite/bindings.yaml
categories: [general, ship, srv, on_foot]
controls:
  LandingGearToggle:
    category: ship
    purpose: raise or lower the landing gear
  ShipSpotLightToggle:
    category: ship
    purpose: ship spotlights on or off
  ToggleCargoScoop:
    category: ship
    purpose: open or close the cargo scoop
  NightVisionToggle:
    category: ship
    purpose: night vision on or off
  ResetPowerDistribution:
    category: ship
    purpose: balance power pips 2/2/2
  IncreaseSystemsPower:
    category: ship
    purpose: one pip to systems (stack for shields priority)
  FocusLeftPanel:
    category: ship
    purpose: open the left-side UI panel (contacts, navigation)
  UI_Select:
    category: general
    purpose: confirm the highlighted UI entry
  UI_Back:
    category: general
    purpose: leave the current UI panel
  UI_Up:
    category: general
    purpose: move the UI cursor up
  UI_Down:
    category: general
    purpose: move the UI cursor down
  UI_Left:
    category: general
    purpose: move the UI cursor left
  UI_Right:
    category: general
    purpose: move the UI cursor right
  CycleNextPanel:
    category: general
    purpose: next UI panel tab
  CyclePreviousPanel:
    category: general
    purpose: previous UI panel tab
