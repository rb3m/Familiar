[project]
name = "familiar-desk"
version = "0.1.0"
description = "Desk companion for Familiar: a local feed (time of day, weather) the companion can talk about."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "familiar>=0.1.0,<1.0.0",
    "pyyaml>=6.0.2",
    "httpx>=0.28.1",
]

[tool.uv.sources]
familiar = { workspace = true }

[project.entry-points."familiar.services"]
desk = "familiar_desk.service:DeskService"

[project.entry-points."familiar_desk.sources"]
clock = "familiar_desk.sources.clock:ClockSource"
weather = "familiar_desk.sources.weather:WeatherSource"

[project.entry-points."familiar_desk.weather_providers"]
open-meteo = "familiar_desk.weather.open_meteo:OpenMeteoProvider"
metar = "familiar_desk.weather.metar:MetarProvider"

[project.entry-points."familiar.commands"]
desk-feed = "familiar_desk.commands:DeskFeedCommand"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/familiar_desk"]
