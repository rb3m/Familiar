[project]
name = "familiar-scs"
version = "0.1.0"
description = "ATS and ETS2 game pack for Familiar."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["familiar>=0.1.0,<1.0.0"]

[tool.uv.sources]
familiar = { workspace = true }

[project.entry-points."familiar.games"]
ats = "familiar_scs.adapter:AtsAdapter"
ets2 = "familiar_scs.adapter:Ets2Adapter"

[project.entry-points."familiar.commands"]
watch = "familiar_scs.commands:Watch"
telemetry-record = "familiar_scs.commands:TelemetryRecord"
landmarks = "familiar_scs.commands:Landmarks"
scs = "familiar_scs.commands:Scs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/familiar_scs"]
