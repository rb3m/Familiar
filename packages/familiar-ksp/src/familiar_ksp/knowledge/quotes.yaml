  text: "Whoopee! Man, that may have been a small one for Neil, but that's a long one for me."
  speaker: Pete Conrad
  context: "Apollo 12, stepping off the ladder to win a bet, 1969"
  attribution: verified
  triggers: [eva_started]
  source_url: https://en.wikipedia.org/wiki/Pete_Conrad
