  context: "Handwritten note after Vostok 1, 1961"
  attribution: attributed
  triggers: [orbit_reached]
  source_url: https://en.wikiquote.org/wiki/Yuri_Gagarin
- id: glenn-fireball
  text: "This is Friendship 7 - a real fireball outside."
  speaker: John Glenn
  context: "Friendship 7 reentry, 1962"
  attribution: verified
  triggers: [reentry]
  source_url: https://en.wikipedia.org/wiki/Mercury-Atlas_6
- id: armstrong-eagle-landed
  text: "Houston, Tranquility Base here. The Eagle has landed."
  speaker: Neil Armstrong
  context: "Apollo 11 lunar landing, 1969"
  attribution: verified
  triggers: [landed]
  source_url: https://en.wikiquote.org/wiki/Neil_Armstrong
- id: duke-turn-blue
  text: "You got a bunch of guys about to turn blue. We're breathing again."
  speaker: Charlie Duke
  context: "Capcom after the low-fuel Apollo 11 landing, 1969"
  attribution: verified
  triggers: [landed]
  source_url: https://en.wikiquote.org/wiki/Neil_Armstrong
- id: gagarin-friend-comrades
  text: "I am a friend, comrades, a friend!"
  speaker: Yuri Gagarin
  context: "To startled farm workers after landing in a field, Vostok 1, 1961"
  attribution: attributed
  triggers: [landed]
  source_url: https://en.wikiquote.org/wiki/Yuri_Gagarin
- id: grissom-dull-thud
  text: "I was lying there, minding my own business, when I heard a dull thud."
  speaker: Gus Grissom
  context: "Liberty Bell 7's hatch blew after splashdown and the capsule sank, 1961"
  attribution: verified
  triggers: [splashed]
  source_url: https://en.wikipedia.org/wiki/Mercury-Redstone_4
- id: armstrong-small-step
  text: "That's one small step for man, one giant leap for mankind."
