# Curated real spaceflight quotes. The core offers one rarely (see familiar/flavor.py);
# the companion paraphrases it in character. "attributed" = popularly credited, origin uncertain.
# Every source_url was checked to contain the quote (2026-11-16).
- id: shepard-light-this-candle
  text: "Why don't you fix your little problem and light this candle?"
  speaker: Alan Shepard
  context: "Freedom 7 launch holds, 1961"
  attribution: attributed
  triggers: [liftoff]
  source_url: https://en.wikipedia.org/wiki/Alan_Shepard
- id: shepard-lowest-bidder
  text: "Every part of this ship was built by the lowest bidder."
  speaker: Alan Shepard (also credited to John Glenn)
  context: "Waiting atop the Redstone before Freedom 7, 1961; told by Gene Kranz"
  attribution: attributed
  triggers: [liftoff, reentry]
  source_url: https://en.wikipedia.org/wiki/Alan_Shepard
- id: gagarin-poyekhali
  text: "Poyekhali! (Let's go!)"
