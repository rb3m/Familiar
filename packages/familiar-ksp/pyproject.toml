[project]
name = "familiar-ksp"
version = "0.1.0"
description = "Kerbal Space Program game pack for Familiar (via the kRPC server mod)."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["familiar>=0.1.0,<1.0.0", "krpc>=0.7.0,<0.8.0", "pyyaml>=6.0.2"]

[tool.uv.sources]
familiar = { workspace = true }

[project.entry-points."familiar.games"]
ksp = "familiar_ksp.adapter:KspAdapter"

[project.entry-points."familiar.commands"]
ksp-probe = "familiar_ksp.commands:KspProbe"
ksp-record = "familiar_ksp.commands:KspRecord"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/familiar_ksp"]
