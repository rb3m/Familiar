[project]
name = "familiar-system"
version = "0.1.0"
description = "System health for Familiar: temperatures, storage, memory and load, with alerts."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "familiar>=0.1.0,<1.0.0",
    "pyyaml>=6.0.2",
    "psutil>=7.0.0",
]

[project.entry-points."familiar.services"]
system = "familiar_system.service:SystemService"

[project.entry-points."familiar.commands"]
system = "familiar_system.commands:SystemCommand"

[tool.uv.sources]
familiar = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/familiar_system"]
