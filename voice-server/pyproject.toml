[project]
name = "familiar-voice-server"
version = "0.1.0"
description = "LAN voice server for Familiar: a leased supervisor that runs one local TTS worker (ADR 0029)"
requires-python = ">=3.12,<3.13"
dependencies = ["aiohttp>=3.10", "pyyaml>=6"]

[project.optional-dependencies]
worker = ["mlx-audio==0.6.7", "numpy"]

[project.scripts]
familiar-voice-server = "familiar_voice_server.supervisor:main"

[dependency-groups]
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/familiar_voice_server"]
