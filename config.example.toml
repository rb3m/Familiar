# Copy to config.toml (git-ignored) or ~/.config/familiar/config.toml and adjust.
# Secrets never go here: settings name the environment variable that holds them.

language = "en"            # catalog code; add languages in the GUI or data override (persona must support it)
# Voice reads ~/.config/familiar/session.toml when present (XDG_CONFIG_HOME respected).
# --session PATH selects another file; CLI flags / FAMILIAR_PERSONA, FAMILIAR_GAME,
# FAMILIAR_LANGUAGE override its choices. FAMILIAR_SESSION selects a session path.
# Session schema: version = 1, crew = ["mira"], language = "en", carrier = "mira",
# banter = 0 (0-10; stored for phase 2). Optional game = "ats"; omit for desk mode.
# No session file: persona below is a crew of one, its own carrier, with banter off.
# --persona selects a crew of one, also overriding the session's carrier.
# Persona YAML may include aliases: {es: [Mira]}, interests: {landmark_: 2.0}.
# display_name is always an alias; interest uses exact then longest prefix, scaled by
# chattiness. User personas may add relationships: {persona_id: "One line"}.
persona = "mira"        # file name in personas_dir, without .yaml
# personas_dir = "my-personas"  # Optional extra personas; packaged Mira is always available.
# GUI-created personas live here and take precedence over personas_dir.
user_personas_dir = "~/.config/familiar/personas"
transcript_dir = "data/transcripts"
# game = "ats"             # optional default; chat/voice --game overrides it

[llm]
backend = "gemini"

[llm.gemini]
model = "gemini-3.5-flash-lite"   # fastest; best for voice
api_key_env = "GEMINI_API_KEY"
temperature = 0.8
max_retries = 2               # retries on 429/5xx before the first word, with backoff
backoff_seconds = 1.0
fallback_models = ["gemini-3.5-flash-lite", "gemini-3.8-flash"]   # tried after retries; same model on the fallback key first
fallback_api_key_env = "GEMINI_PAID_KEY"   # optional: separate key for fallback models (e.g. capped paid key)
first_chunk_timeout_seconds = 8.0   # an overloaded model may stall silently; give up and fall back
timeout_seconds = 30.0
# Optional quota guard for banter: fill in current limits for your model/key tier.
# Estimates count this process's attempts (including retries), across keys; no quota API call.
# Banter stops at 90% of a configured minute/day limit, or whenever any model is parked.
# Use model IDs from your [llm.gemini] configuration; restart to refresh these settings.
# [llm.gemini.quota_limits."your-model-id"]
# minute = 10
# day = 1000

# Speech settings are scoped by backend, including the optional fallback.
[stt]
backend = "elevenlabs"
fallback = "gemini"

[stt.elevenlabs]
model = "scribe_v2"
api_key_env = "ELEVENLABS_API_KEY"
timeout_seconds = 30.0

[stt.gemini]
model = "gemini-3.5-transcribe"
api_key_env = "GEMINI_API_KEY"
timeout_seconds = 30.0

[tts]
backend = "elevenlabs"
fallback = "gemini"

[tts.elevenlabs]
model = "eleven_flash_v2_5"
api_key_env = "ELEVENLABS_API_KEY"
timeout_seconds = 30.0

[tts.gemini]
model = "gemini-3.8-flash-lite-tts"
api_key_env = "GEMINI_API_KEY"
timeout_seconds = 30.0

[ptt]
backend = "terminal"       # Enter starts recording, Enter stops; Ctrl-C exits

# Linux joystick/HOTAS: run familiar ptt-setup to detect device and button.
# Set backend = "evdev" above to enable. The game retains access to the device.
# [ptt.evdev]
# device = "Thrustmaster"  # substring of device name, or /dev/input/eventN
# button = "BTN_TRIGGER"  # evdev button name or integer code

# Game backends receive their own settings table; absent tables default to {}.
[games.ats]
url = "http://localhost:25555/api/ets2/telemetry"
poll_interval_s = 1.0
units = "imperial"         # display only; internal telemetry remains SI
knowledge_paths = []      # curated landmark/lore packs

# Hands: newest controls file in steam_profiles/profiles is selected automatically.
# With no controls file, use default SCS keys. Existing profiles never inherit defaults.
# Bindings rescan before presses; inspect: familiar scs bindings ats --suggest
# Catalogue/defaults: ~/.config/familiar/data/familiar_scs/*.yaml
# profile = "PROFILE_FOLDER"   # or a profile directory / controls file
# [games.ats.keys]             # lowercase evdev names; + joins a chord
# beacon = "leftshift+o"
# radio = "o"                 # bind radio power in-game too; unbound by default
# blinker_left = "leftbrace"   # variant overrides: blinker_left/right,
# retarder_up = "semicolon"    # retarder_up/down, radio_station_next/previous
# [games.ats.hold_s]           # seconds; overrides actions.yaml holds (default 0.08)
# horn = 0.6
# engine = 0.08

# [games.ets2]
# profile = "PROFILE_FOLDER"   # or directory; same discovery and defaults as ATS
# [games.ets2.keys]
# beacon = "o"
# [games.ets2.hold_s]
# air_horn = 0.6

# [games.ksp]
# address = "127.0.0.1"
# rpc_port = 50000
# timeout_s = 3.0          # telemetry connection timeout
# action_timeout_s = 3.0   # timeout for hands actions (dedicated worker thread)
# poll_interval_s = 0.5

# [games.elite]
# journal_dir = "~/path/to/Elite Dangerous"  # auto-discovered in Steam/Proton libraries
# bindings_dir = "~/path/to/Options/Bindings"
# poll_interval_s = 0.5
# edsm_enabled = true       # anonymous public lookups only when a query action is called
# edsm_min_interval_s = 1.0  # serial EDSM request pacing
# default_jump_range_ly = 20 # fallback when Loadout has no MaxJumpRange
# [games.elite.hold_s]
# landing_gear = 0.08       # per-action key hold duration in seconds

[director]
enabled = true
idle_minutes = 12
notable_cooldown_s = 40
ambient_cooldown_s = 300
# Cooldowns and idle interval scale by (1.5 - persona.chattiness).

[memory]
enabled = true
path = ""                 # default: $XDG_DATA_HOME/familiar/memory.db or ~/.local/share/familiar/memory.db
recall_probability = 0.25  # chance on revisiting a place with a distinctive earlier episode
recall_cooldown_min = 45   # real minutes between spoken memories; same episode/persona: 7 days

[flavor]
enabled = true
probability = 0.2          # chance to offer an event's real quote for a loose paraphrase
cooldown_min = 30          # global cooldown in real minutes, across games and personas
item_cooldown_days = 14    # cooldown per quote ID within its game
# Uses share the memory database; with memory disabled, uses last only for this process.

[alerts]
enabled = true            # voice-set, one-shot telemetry alerts; session only
lead_s = 1.0              # fire early to cover speech latency (announcements skip the LLM); >= 0
max_alerts = 8            # integer from 1 to 8

# [hands]
# enabled = true          # actions only on player turns; risky actions need a later yes
# keyboard = "uinput"     # familiar.keyboard backend; Linux /dev/uinput permissions needed
# confirm_ttl_s = 30      # positive seconds to confirm a pending action
# action_timeout_s = 5    # positive seconds; timeout means outcome unknown, never retried
# [hands.affirmatives]    # extra words, added to built-in en/es/ja lists (all are checked)
# en = ["proceed"]
# [hands.negatives]
# en = ["hold on"]

# [desk]
# enabled = false        # local time context beside games and at the desk
# interval_s = 60        # feed sampling interval in seconds
# latitude = 19.4326     # set both coordinates for offline solar context
# longitude = -99.1332
# timezone = "America/Mexico_City" # defaults to the system local zone

[music]
enabled = false          # companion DJ, beside any game or in desk voice mode
service = "blend"        # familiar.services entry point; "pear" keeps YouTube-only playback
# library_paths = []      # default: XDG Music dir
# library_db = "~/.local/state/familiar/music/library.sqlite" # default follows XDG_STATE_HOME
# blend = { library = 70, persona = 20, discovery = 10 } # persona follows the current carrier taste
# local_min_matches = 8   # fewer local genre matches fall through to YouTube Music
# local_min_artists = 4   # minimum distinct primary artists for automatic local genres
# artist_tag_min_share = 0.25 # fraction of highest artist-tag count; file genres always match
# skip_early_s = 30       # early player-UI changes count as skips
# played_fraction = 0.8  # natural changes after this fraction count as played
# taste_half_life_days = 60 # exponential decay of behaviour signals
# played_gain = 0.15
# skip_penalty = 0.35
# taste_min = 0.2
# taste_max = 3.0
# artist_cooldown_songs = 8
# artist_cooldown_weight = 0.3
# artist_batch_share = 0.3 # rounded up to a whole song per batch
# occasional_genres = ["cumbia", "salsa", "merengue", "banda", "reggaeton"]
# occasional_weight = 0.25 # at most one occasional-style track per batch
# min_track_s = 90        # automatic local picks; explicit songs/artists may be shorter
# library_enrich = true  # background MusicBrainz tags for pending artists
# Optional service settings below override packaged YAML defaults.
# base_url = "http://127.0.0.1:26538"
# client_id = "familiar"  # approve this client once in Pear Desktop
# call_timeout_s = 5      # deadline for each REST call
# auth_timeout_s = 60     # time to click Allow during the handshake
# poll_interval_s = 5     # low-rate now-playing poll
# recovery_interval_s = 30 # quiet health re-check while the player is unavailable
# insert_wait_s = 8       # wait for Pear to add a song before skipping to it
# insert_poll_s = 0.1     # queue check interval during that wait
# token_path = "familiar/music/pear-token" # relative to XDG_STATE_HOME (~/.local/state)
# duck_level = 0.25       # fraction of the user's base volume while listening/speaking
# volume_tolerance = 5   # a read this close to the level we set is treated as ours
# play_volume = 70        # Pear slider level when music starts, unless a volume was asked for
# calm_volume = 40        # level for calmer music, always applied
# queue_top_up = 5        # short radio batch; excludes queued IDs and dislikes
# remark_every = [3, 4]   # remark on the new song every 3-4 song changes (picked songs don't count)
# dj_turn_every = [8, 12] # the carrier may choose new music every 8-12 song changes
# autonomy_hold_s = 900   # no autonomous pick within this long of a music request
# autonomous_picks = true # false: the carrier only picks music when asked
# reseed_cooldown_s = 15  # minimum gap for calmer / more-like-this requests
# search_timeout_s = 10  # deadline for blocking discovery calls (run in a worker thread)
# search_limit = 8        # candidate songs per search
# calmer_query = "calm relaxing music"
# genre_batch = 10        # songs queued at once for a genre/mood request (shuffled curated playlist)
# playlist_tracks = 100   # playlist songs fetched to shuffle from; the rest top up the queue later
# mpv local-library player (call_timeout_s above also bounds its IPC calls):
# executable = "mpv"      # local-library player binary
# args = ["--idle=yes", "--no-video", "--no-terminal"] # extra mpv arguments
# socket_dir = "familiar" # IPC socket directory under XDG_RUNTIME_DIR
# socket_name = "mpv.sock"
# quit_timeout_s = 3      # wait for mpv to exit on shutdown before terminating it
# spawn_poll_s = 0.05     # interval while waiting for a spawned mpv's socket
# Pear endpoints and queue insertion constants live in familiar_music/pear.yaml;
# override with ~/.config/familiar/data/familiar_music/pear.yaml. DJ tuning is in
# familiar_music/music.yaml at the same override root. Restart Familiar to reload.
# Optional [music.endpoints] replaces individual named paths (auth, song, volume,
# play, pause, next, queue, queue_item, like, dislike). insert_now / insert_end override queue
# insertion constants. Prefer YAML for these API details.
