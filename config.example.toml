# Copy to config.toml (git-ignored) or ~/.config/familiar/config.toml and adjust.
# Secrets never go here: settings name the environment variable that holds them.

language = "en"            # en | es | ja (persona must support it)
persona = "mira"        # file name in personas_dir, without .yaml
personas_dir = "personas"
transcript_dir = "data/transcripts"

[llm]
backend = "gemini"

[llm.gemini]
model = "gemini-3.5-flash-lite"   # fastest; best for voice
api_key_env = "GEMINI_API_KEY"
temperature = 0.8
max_retries = 2               # retries on 429/5xx before the first word, with backoff
backoff_seconds = 1.0
fallback_models = ["gemini-3.8-flash"]   # tried after retries run out
first_chunk_timeout_seconds = 8.0   # an overloaded model may stall silently; give up and fall back
timeout_seconds = 30.0

# Speech settings are scoped by backend, including the optional fallback.
[stt]
backend = "elevenlabs"
fallback = "gemini"

[stt.elevenlabs]
model = "scribe_v2"
api_key_env = "ELEVENLABS_API_KEY"
timeout_seconds = 30.0

[stt.gemini]
model = "gemini-3.5-transcribe"
api_key_env = "GEMINI_API_KEY"
timeout_seconds = 30.0

[tts]
backend = "elevenlabs"
fallback = "gemini"

[tts.elevenlabs]
model = "eleven_flash_v2_5"
api_key_env = "ELEVENLABS_API_KEY"
timeout_seconds = 30.0

[tts.gemini]
model = "gemini-3.8-flash-lite-tts"
api_key_env = "GEMINI_API_KEY"
timeout_seconds = 30.0

[ptt]
backend = "terminal"       # Enter starts recording, Enter stops; Ctrl-C exits

# Linux joystick/HOTAS: run familiar ptt-setup to detect device and button.
# Set backend = "evdev" above to enable. The game retains access to the device.
# [ptt.evdev]
# device = "Thrustmaster"  # substring of device name, or /dev/input/eventN
# button = "BTN_TRIGGER"  # evdev button name or integer code
